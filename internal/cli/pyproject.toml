[project]
name = "sdkv2-patterns-cli"
version = "0.1.0"
description = "Internal CLI for SDK v2 patterns."
requires-python = ">=3.14,<3.15"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
sdkv2-patterns-cli = "svp:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "svp"
