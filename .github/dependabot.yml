version: 2

updates:
  - package-ecosystem: gomod
    directory: /internal/reference-provider
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 14
    groups:
      go-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /internal/cli
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 14
    groups:
      python-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
